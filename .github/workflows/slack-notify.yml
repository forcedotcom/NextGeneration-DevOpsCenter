name: Slack Notifications

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*GitHub: ${{ github.event_name }}* on `${{ github.repository }}`",
              "attachments": [
                {
                  "color": "${{ github.event_name == 'issues' && github.event.action == 'closed' && '#d73a4a' || github.event_name == 'pull_request' && '#0075ca' || '#36a64f' }}",
                  "fields": [
                    {
                      "title": "Event",
                      "value": "${{ github.event_name }} — ${{ github.event.action }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Title",
                      "value": "${{ github.event.pull_request.title || github.event.issue.title || 'N/A' }}",
                      "short": false
                    },
                    {
                      "title": "Link",
                      "value": "${{ github.event.pull_request.html_url || github.event.issue.html_url || github.event.comment.html_url }}",
                      "short": false
                    }
                  ]
                }
              ]
            }